<rect x="1032" y="24" width="160" height="36" rx="6" fill="#0f766e" stroke="#0f766e"/>
<text x="1112.0" y="47" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Download Answers</text>
