seed: 42
airl: true

defaults:
   - override hydra/job_logging: default
   - override hydra/hydra_logging: default

model:
  checkpoint: 500
  name: "/mnt/pdata/caf83/icml_math/outputs/${wandb.run_name}/checkpoint-${model.checkpoint}"
  policy_name: "${model.name}"
  reward_name: "Qwen/Qwen2.5-3B-Instruct"
  max_prompt_length: 300
  max_completion_length: 824
  load_in_4bit: true
  fast_inference: true
  policy_gpu_memory_utilization: 0.4
  reward_gpu_memory_utilization: 0.4
  
  # Common settings
  lora_rank: 256  # Base LoRA rank
  use_gradient_checkpointing: true
  
  # Policy model specific
  policy_lora_rank: 256  # Optional: override base rank for policy
  policy_learning_rate: 1e-5
  add_expert_to_policy_optim: true
  add_expert_to_policy_balanced: false

  # Reward model specific  
  reward_lora_rank: 256  # Optional: override base rank for reward
  reward_learning_rate: 1e-5
  dense_rewards: true  # Whether to use dense rewards (token-level) or sparse (sequence-level)
  dense_gamma: 0.99
  advantage_calculation: "discounted_dense"

dataset:
  name: "gsm8k_kd"   # Change to "gsm8k_kd" (or other) to switch datasets
  split: "test"

sampling:
  n_samples: 16
  temperature: 1
  top_p: 0.95

eval:
  ks : [1, 3, 5, 10]
  use_vllm: true
  per_device_eval_batch_size: 6
  report_to: "none"

wandb:
  project: "expert_reasoning_math_icml"
  entity: eth_dlad_team32
  run_name: eval