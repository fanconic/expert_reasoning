# @package _global_
defaults:
  - mean_g
  - _self_

model:
  max_completion_length: 128
  lora_rank: 16
  policy_lora_rank: 16
  reward_lora_rank: 16
  warmup_reward_dir:
  log_segment_example: true

dataset:
  train_ratio: 0.01
  val_ratio: 0.01

training:
  report_to: "none"
  output_dir: ./outputs/debug_airl_segment
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 1
  reward_warmup_steps: 0
  max_steps: 2
  buffer_size: 0

sampling:
  num_generations: 4

eval:
  do_eval: false

wandb:
  run_name: debug_airl_segment
